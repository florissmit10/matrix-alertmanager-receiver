name: Publish Fork Image
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and push ghcr.io image
    # Fork-only workflow: never run in the upstream repository.
    if: github.repository == 'florissmit10/matrix-alertmanager-receiver'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: buildx
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - id: login
        name: Login to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: publish
        name: Publish Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/florissmit10/matrix-alertmanager-receiver:latest
            ghcr.io/florissmit10/matrix-alertmanager-receiver:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=matrix-alertmanager-receiver
            org.opencontainers.image.licenses=GPLv3
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: true
      - id: digest
        name: Report digest
        run: echo "ghcr.io/florissmit10/matrix-alertmanager-receiver@${{ steps.publish.outputs.digest }}"
